databases:
  - name: pula-mania-postgres
    databaseName: pula_mania
    plan: free
    region: oregon

services:
  - type: web
    name: pula-mania
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pula-mania-postgres
          property: connectionString
