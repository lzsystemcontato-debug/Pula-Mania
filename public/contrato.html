<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contrato de Locação | Pula Mania</title>
<link rel="icon" type="image/png" href="/img/logo.png" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  .contract-wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  .contract-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; }
  .contract-brand { display:flex; align-items:center; gap:10px; margin-bottom: 18px; }
  .contract-brand img { width: 36px; height: 36px; border-radius: 50%; }
  .contract-brand strong { font-size: 1.1rem; color: var(--dark); }
  .contract-summary { background: var(--gray-light); border-radius: 14px; padding: 16px 18px; margin-bottom: 22px; font-size: 0.9rem; }
  .contract-summary dt { color: var(--gray); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .03em; margin-top: 10px; }
  .contract-summary dt:first-child { margin-top: 0; }
  .contract-summary dd { margin: 2px 0 0; font-weight: 600; color: var(--dark); }
  .terms-box { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 0.85rem; line-height: 1.55; white-space: pre-wrap; color: #374151; background: #fafafa; margin-bottom: 18px; }
  .contract-field { margin-bottom: 14px; }
  .contract-field label { display:block; font-size: 0.8rem; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
  .contract-field input[type=text] { width:100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; font-family: inherit; }
  .accept-row { display:flex; gap:10px; align-items:flex-start; font-size: 0.85rem; margin: 18px 0; }
  .accept-row input { margin-top: 3px; width:auto; }
  .contract-state { text-align:center; padding: 40px 20px; }
  .contract-state .icon { font-size: 2.4rem; margin-bottom: 10px; }
  .contract-alert { background:#fdecec; color:#b3261e; border-radius:10px; padding:10px 14px; font-size:0.85rem; font-weight:600; margin-bottom:14px; display:none; }
  .contract-alert.show { display:block; }
  .signature-block { display:flex; gap:24px; flex-wrap:wrap; margin-top:24px; padding-top:18px; border-top:1px solid var(--border); font-size:0.85rem; }
  .sig-party strong { display:block; font-size:0.75rem; color:var(--gray); letter-spacing:.03em; margin-bottom:4px; }
  .sig-party div { color: var(--dark); }
</style>
</head>
<body>

<div class="contract-wrap">
  <div class="contract-card">
    <div class="contract-brand">
      <img src="/img/logo.png" alt="" />
      <strong id="c-company">Pula Mania</strong>
    </div>

    <div id="contract-loading">Carregando contrato...</div>
    <div id="contract-content" style="display:none"></div>
  </div>
</div>

<script src="/js/contrato.js"></script>
</body>
</html>
